server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # The page also carries this policy in a <meta> tag; the header makes it enforceable before parsing.
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src https://blockstream.info https://mempool.space; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cache-Control "no-cache" always;

  location / { try_files $uri $uri/ =404; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }
}
