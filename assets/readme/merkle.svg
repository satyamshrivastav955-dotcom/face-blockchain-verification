stroke-width="1.4"/><text class="mono" x="186.0" y="370" text-anchor="middle" font-size="10" style="fill:#7a6f5d">record 1</text><text class="mono" x="186.0" y="386" text-anchor="middle" font-size="9.5" style="fill:#483f33">hash‖url</text><rect x="244" y="350" width="88" height="46" fill="#faf6ea" stroke="#211c16" stroke-width="1.4"/><text class="mono" x="288.0" y="370" text-anchor="middle" font-size="10" style="fill:#7a6f5d">record 2</text><text class="mono" x="288.0" y="386" text-anchor="middle" font-size="9.5" style="fill:#483f33">hash‖url</text><rect x="346" y="350" width="88" height="46" fill="#faf6ea" stroke="#211c16" stroke-width="1.4"/><text class="mono" x="390.0" y="370" text-anchor="middle" font-size="10" style="fill:#7a6f5d">record 3</text><text class="mono" x="390.0" y="386" text-anchor="middle" font-size="9.5" style="fill:#483f33">hash‖url</text><rect x="448" y="350" width="88" height="46" fill="#faf6ea" stroke="#2e5842" stroke-width="2.4"/><text class="mono" x="492.0" y="370" text-anchor="middle" font-size="10" style="fill:#7a6f5d">record 4</text><text class="mono" x="492.0" y="386" text-anchor="middle" font-size="9.5" style="fill:#483f33">hash‖url</text><rect x="550" y="350" width="88" height="46" fill="#faf6ea" stroke="#86281f" stroke-width="2.4"/><text class="mono" x="594.0" y="370" text-anchor="middle" font-size="10" style="fill:#7a6f5d">record 5</text><text class="mono" x="594.0" y="386" text-anchor="middle" font-size="9.5" style="fill:#483f33">hash‖url</text><rect x="652" y="350" width="88" height="46" fill="#faf6ea" stroke="#211c16" stroke-width="1.4"/><text class="mono" x="696.0" y="370" text-anchor="middle" font-size="10" style="fill:#7a6f5d">record 6</text><text class="mono" x="696.0" y="386" text-anchor="middle" font-size="9.5" style="fill:#483f33">hash‖url</text><rect x="754" y="350" width="88" height="46" fill="#faf6ea" stroke="#211c16" stroke-width="1.4"/><text class="mono" x="798.0" y="370" text-anchor="middle" font-size="10" style="fill:#7a6f5d">record 7</text><text class="mono" x="798.0" y="386" text-anchor="middle" font-size="9.5" style="fill:#483f33">hash‖url</text><g class="proof" style="animation-delay:0.6s"><circle cx="492.0" cy="334" r="11" fill="#2e5842"/><text class="mono" x="492.0" y="338" text-anchor="middle" font-size="12" font-weight="700" style="fill:#faf6ea">1</text></g><g class="proof" style="animation-delay:1.1s"><circle cx="747.0" cy="238" r="11" fill="#2e5842"/><text class="mono" x="747.0" y="242" text-anchor="middle" font-size="12" font-weight="700" style="fill:#faf6ea">2</text></g><g class="proof" style="animation-delay:1.6s"><circle cx="237.0" cy="156" r="11" fill="#2e5842"/><text class="mono" x="237.0" y="160" text-anchor="middle" font-size="12" font-weight="700" style="fill:#faf6ea">3</text></g><line class="flow" x1="471.0" y1="104" x2="880" y2="104" stroke="#24364f" stroke-width="2"/><rect x="880" y="62" width="290" height="124" fill="#faf6ea" stroke="#24364f" stroke-width="2"/><text class="mono" x="898" y="86" font-size="11" letter-spacing="2" font-weight="700" style="fill:#24364f">ON-CHAIN · ONE TRANSACTION</text><text x="898" y="116" font-size="19" style="fill:#211c16">registerBatch(root, size)</text><text x="898" y="142" font-size="13" style="fill:#483f33">≈ 74,200 gas for N = 1 or N = 1,000</text><text x="898" y="162" font-size="13" font-style="italic" style="fill:#7a6f5d">≈ 74 gas per record at N = 1,000</text><g class="proof" style="animation-delay:.3s"><text class="mono" x="880" y="232" font-size="10.5" letter-spacing="2" style="fill:#86281f">RECORD 5 KEEPS</text><text x="880" y="256" font-size="14" style="fill:#483f33">its own proof: 3 sibling hashes (green).</text><text x="880" y="276" font-size="14" style="fill:#483f33">Recompute the leaf from the record,</text><text x="880" y="296" font-size="14" style="fill:#483f33">fold the proof, compare to the root,</text><text x="880" y="316" font-size="14" style="fill:#483f33">then look the root up on-chain.</text><text x="880" y="344" font-size="12.5" font-style="italic" style="fill:#7a6f5d">The leaf binds the URL commitment, so a</text><text x="880" y="362" font-size="12.5" font-style="italic" style="fill:#7a6f5d">valid proof also proves the URL matches.</text></g><text class="mono" x="36" y="448" font-size="10.5" style="fill:#7a6f5d">Gas measured on an in-process EVM (solc 0.8.24); real chains add calldata and L1 data fees. Registry v3 is compiled and tested, not deployed.</text>
