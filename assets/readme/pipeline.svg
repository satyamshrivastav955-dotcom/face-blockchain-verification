"node" style="animation-delay:2.7s"><rect class="box" x="530" y="150" width="140" height="150" fill="#faf6ea" stroke="#211c16" stroke-width="1.5" style="animation-delay:2.7s"/><text class="mono" x="542" y="176" font-size="11" style="fill:#7a6f5d">04</text><text x="542" y="206" font-size="21" style="fill:#211c16">Download</text><text x="542" y="232" font-size="12.5" style="fill:#483f33">SSRF-guarded</text><text x="542" y="250" font-size="12.5" style="fill:#483f33">parallel, bounded</text><rect x="542" y="264" width="62" height="22" fill="none" stroke="#9e6b14" stroke-width="1.5"/><text class="mono" x="548" y="279" font-size="10" font-weight="700" letter-spacing="1.4" style="fill:#9e6b14">NETWORK</text></g></g><line class="link" x1="838" y1="225.0" x2="866" y2="225.0" stroke="#b3a584" stroke-width="2.4"/><g class="in" style="animation-delay:0.78s"><g class="node" style="animation-delay:3.6s"><rect class="box" x="698" y="150" width="140" height="150" fill="#faf6ea" stroke="#211c16" stroke-width="1.5" style="animation-delay:3.6s"/><text class="mono" x="710" y="176" font-size="11" style="fill:#7a6f5d">05</text><text x="710" y="206" font-size="21" style="fill:#211c16">Re-examine</text><text x="710" y="232" font-size="12.5" style="fill:#483f33">face · SIFT+RANSAC</text><text x="710" y="250" font-size="12.5" style="fill:#483f33">· pHash</text><rect x="710" y="264" width="48" height="22" fill="none" stroke="#2e5842" stroke-width="1.5"/><text class="mono" x="716" y="279" font-size="10" font-weight="700" letter-spacing="1.4" style="fill:#2e5842">LOCAL</text></g></g><line class="link" x1="1006" y1="225.0" x2="1034" y2="225.0" stroke="#b3a584" stroke-width="2.4"/><g class="in" style="animation-delay:0.90s"><g class="node" style="animation-delay:4.5s"><rect class="box" x="866" y="150" width="140" height="150" fill="#faf6ea" stroke="#211c16" stroke-width="1.5" style="animation-delay:4.5s"/><text class="mono" x="878" y="176" font-size="11" style="fill:#7a6f5d">06</text><text x="878" y="206" font-size="21" style="fill:#211c16">Seal</text><text x="878" y="232" font-size="12.5" style="fill:#483f33">restricted JCS</text><text x="878" y="250" font-size="12.5" style="fill:#483f33">+ SHA-256</text><rect x="878" y="264" width="48" height="22" fill="none" stroke="#2e5842" stroke-width="1.5"/><text class="mono" x="884" y="279" font-size="10" font-weight="700" letter-spacing="1.4" style="fill:#2e5842">LOCAL</text></g></g><g class="in" style="animation-delay:1.02s"><g class="node" style="animation-delay:5.4s"><rect class="box" x="1034" y="150" width="140" height="150" fill="#faf6ea" stroke="#211c16" stroke-width="1.5" style="animation-delay:5.4s"/><text class="mono" x="1046" y="176" font-size="11" style="fill:#7a6f5d">07</text><text x="1046" y="206" font-size="21" style="fill:#211c16">Anchor</text><text x="1046" y="232" font-size="12.5" style="fill:#483f33">single or</text><text x="1046" y="250" font-size="12.5" style="fill:#483f33">Merkle batch</text><rect x="1046" y="264" width="70" height="22" fill="none" stroke="#24364f" stroke-width="1.5"/><text class="mono" x="1052" y="279" font-size="10" font-weight="700" letter-spacing="1.4" style="fill:#24364f">ON-CHAIN</text></g></g><line x1="26" y1="338" x2="1174" y2="338" stroke="#211c16" stroke-width="2"/><g class="in" style="animation-delay:1.4s"><rect x="36" y="356" width="10" height="70" fill="#2e5842"/><text class="mono" x="60" y="372" font-size="11" font-weight="700" letter-spacing="1.6" style="fill:#2e5842">NEVER SENT ANYWHERE</text><text x="60" y="392" font-size="13" style="fill:#483f33">Face crops and embeddings. The query image</text><text x="60" y="409" font-size="13" style="fill:#483f33">stays local unless you consent to search.</text></g><g class="in" style="animation-delay:1.6s"><rect x="424" y="356" width="10" height="70" fill="#9e6b14"/><text class="mono" x="448" y="372" font-size="11" font-weight="700" letter-spacing="1.6" style="fill:#9e6b14">NEEDS YOUR CONSENT</text><text x="448" y="392" font-size="13" style="fill:#483f33">Search provider and optional public image</text><text x="448" y="409" font-size="13" style="fill:#483f33">host. What is sent is shown first.</text></g><g class="in" style="animation-delay:1.8s"><rect x="812" y="356" width="10" height="70" fill="#24364f"/><text class="mono" x="836" y="372" font-size="11" font-weight="700" letter-spacing="1.6" style="fill:#24364f">ON THE PUBLIC LEDGER</text><text x="836" y="392" font-size="13" style="fill:#483f33">A 32-byte hash and a keccak256 URL</text><text x="836" y="409" font-size="13" style="fill:#483f33">commitment. Never a face, vector or the URL.</text></g>
</svg>
