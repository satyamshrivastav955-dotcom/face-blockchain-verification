><text class="mono val" x="599.8" y="486" font-size="12" font-weight="700" style="fill:#211c16;animation-delay:1.33s">90.17%</text><text class="mono" x="320" y="514" text-anchor="end" font-size="11" style="fill:#483f33">ArcFace-R50</text><rect class="bar" x="330" y="498" width="743.1" height="22" fill="#86281f" opacity=".9" style="animation-delay:0.70s"/><text class="mono val" x="1081.1" y="514" font-size="12" font-weight="700" style="fill:#211c16;animation-delay:1.40s">99.67%</text><text class="mono" x="320" y="542" text-anchor="end" font-size="11" style="fill:#483f33">ArcFace-R100</text><rect class="bar" x="330" y="526" width="734.7" height="22" fill="#24364f" opacity=".9" style="animation-delay:0.77s"/><text class="mono val" x="1072.7" y="542" font-size="12" font-weight="700" style="fill:#211c16;animation-delay:1.47s">99.50%</text><text x="36" y="596" font-size="15" style="fill:#211c16">Latency per 1280-px image (median)</text><text class="mono" x="320" y="623" text-anchor="end" font-size="11" style="fill:#483f33">SFace</text><rect class="bar" x="330" y="608" width="560.0" height="20" fill="#7a6f5d" opacity=".9" style="animation-delay:0.84s"/><text class="mono val" x="898.0" y="623" font-size="12" font-weight="700" style="fill:#211c16;animation-delay:1.54s">169 ms · CPU</text><text class="mono" x="320" y="651" text-anchor="end" font-size="11" style="fill:#483f33">ArcFace-R50</text><rect class="bar" x="330" y="636" width="71.1" height="20" fill="#86281f" opacity=".9" style="animation-delay:0.91s"/><text class="mono val" x="409.1" y="651" font-size="12" font-weight="700" style="fill:#211c16;animation-delay:1.61s">21 ms · GPU</text><text class="mono" x="320" y="679" text-anchor="end" font-size="11" style="fill:#483f33">ArcFace-R100</text><rect class="bar" x="330" y="664" width="86.8" height="20" fill="#24364f" opacity=".9" style="animation-delay:0.98s"/><text class="mono val" x="424.8" y="679" font-size="12" font-weight="700" style="fill:#211c16;animation-delay:1.68s">26 ms · GPU</text><text class="mono" x="36" y="728" font-size="10.5" style="fill:#7a6f5d">Accuracy axes start at 85% (stated, not hidden). LFW is near-saturated: clean accuracy barely separates the models; the stressed probes do.</text><text class="mono" x="36" y="746" font-size="10.5" style="fill:#7a6f5d">ArcFace ran on an RTX 4050 laptop GPU, SFace on CPU: a latency comparison of setups, not of models. ArcFace weights are non-commercial research only.</text>
