<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-label="Evidence ladder: face match, geometric derivative, pHash derivative">
<title>Evidence ladder: face match, geometric derivative, pHash derivative</title>
<style>
text { font-family: Iowan Old Style, Palatino Linotype, Palatino, Book Antiqua, Georgia, serif; fill: #211c16; }
.mono { font-family: ui-monospace, Cascadia Mono, SF Mono, Menlo, Consolas, Courier New, monospace; }
.cap { font-family: ui-monospace, Cascadia Mono, SF Mono, Menlo, Consolas, Courier New, monospace; font-size: 11px; letter-spacing: 2.2px; text-transform: uppercase; fill: #7a6f5d; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    @keyframes slide { from { opacity: 0; transform: translateX(-26px); } to { opacity: 1; transform: none; } }
    @keyframes thump { 0% { opacity: 0; transform: rotate(-12deg) scale(1.8); } 60% { opacity: .95; transform: rotate(var(--t)) scale(.94); } 100% { opacity: .9; transform: rotate(var(--t)) scale(1); } }
    .card { opacity: 0; animation: slide .7s ease forwards; }
    .st { transform-box: fill-box; transform-origin: center; opacity: 0; animation: thump .55s cubic-bezier(.2,1.3,.4,1) forwards; }
    </style>
<rect width="1200" height="450" fill="#f5efe0"/><g stroke="#d2c7ae" stroke-width="1" opacity="0.55"><line x1="0" y1="32" x2="1200" y2="32"/><line x1="0" y1="64" x2="1200" y2="64"/><line x1="0" y1="96" x2="1200" y2="96"/><line x1="0" y1="128" x2="1200" y2="128"/><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="192" x2="1200" y2="192"/><line x1="0" y1="224" x2="1200" y2="224"/><line x1="0" y1="256" x2="1200" y2="256"/><line x1="0" y1="288" x2="1200" y2="288"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="352" x2="1200" y2="352"/><line x1="0" y1="384" x2="1200" y2="384"/><line x1="0" y1="416" x2="1200" y2="416"/><line x1="0" y1="448" x2="1200" y2="448"/></g><rect x="1" y="1" width="1198" height="448" fill="none" stroke="#211c16" stroke-width="2"/><text class="cap" x="36" y="48">Evidence ladder · every accepted candidate carries exactly one label</text><g class="card" style="animation-delay:0.15s"><rect x="36" y="72" width="808" height="96" fill="#faf6ea" stroke="#211c16" stroke-width="1.5"/><rect x="36" y="72" width="8" height="96" fill="#2e5842"/><text class="mono" x="62" y="96" font-size="11" letter-spacing="2" style="fill:#7a6f5d">TIER 1</text><text x="62" y="124" font-size="23" style="fill:#211c16">Face match</text><text x="62" y="145" font-size="13" style="fill:#483f33">A face in the candidate scores at or above the engine's threshold against the query face.</text><text x="62" y="162" font-size="12" font-style="italic" style="fill:#7a6f5d">Similarity under a named model. Never identity.</text></g><g class="st" style="--t:-4deg;animation-delay:0.70s"><rect x="866" y="94" width="145" height="46" fill="none" stroke="#2e5842" stroke-width="2.6"/><text class="mono" x="938" y="123" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="3" style="fill:#2e5842">FACE MATCH</text></g><g class="card" style="animation-delay:0.40s"><rect x="36" y="180" width="808" height="96" fill="#faf6ea" stroke="#211c16" stroke-width="1.5"/><rect x="36" y="180" width="8" height="96" fill="#9e6b14"/><text class="mono" x="62" y="204" font-size="11" letter-spacing="2" style="fill:#7a6f5d">TIER 2</text><text x="62" y="232" font-size="23" style="fill:#211c16">Image derivative · geometric</text><text x="62" y="253" font-size="13" style="fill:#483f33">SIFT + RANSAC: ≥25 local features agree on one transform (crop, rotate, mirror, resize).</text><text x="62" y="270" font-size="12" font-style="italic" style="fill:#7a6f5d">Shared rendered content. Says nothing about faces.</text></g><g class="st" style="--t:3deg;animation-delay:0.95s"><rect x="866" y="202" width="208" height="46" fill="none" stroke="#9e6b14" stroke-width="2.6"/><text class="mono" x="970" y="231" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="3" style="fill:#9e6b14">NOT A FACE MATCH</text></g><g class="card" style="animation-delay:0.65s"><rect x="36" y="288" width="808" height="96" fill="#faf6ea" stroke="#211c16" stroke-width="1.5"/><rect x="36" y="288" width="8" height="96" fill="#9e6b14"/><text class="mono" x="62" y="312" font-size="11" letter-spacing="2" style="fill:#7a6f5d">TIER 3</text><text x="62" y="340" font-size="23" style="fill:#211c16">Image derivative · pHash</text><text x="62" y="361" font-size="13" style="fill:#483f33">64-bit DCT hash within 12 bits of the query image.</text><text x="62" y="378" font-size="12" font-style="italic" style="fill:#7a6f5d">Image similarity only. Misses heavy crops and mirrors.</text></g><g class="st" style="--t:-3deg;animation-delay:1.20s"><rect x="866" y="310" width="208" height="46" fill="none" stroke="#9e6b14" stroke-width="2.6"/><text class="mono" x="970" y="339" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="3" style="fill:#9e6b14">NOT A FACE MATCH</text></g><g class="card" style="animation-delay:.9s"><line x1="1150" y1="84" x2="1150" y2="372" stroke="#211c16" stroke-width="2"/><path d="M1143 362 L1150 378 L1157 362" fill="none" stroke="#211c16" stroke-width="2"/><text class="mono" x="1138" y="84" text-anchor="end" font-size="10" letter-spacing="2" style="fill:#7a6f5d">STRONGER</text><text class="mono" x="1138" y="384" text-anchor="end" font-size="10" letter-spacing="2" style="fill:#7a6f5d">WEAKER</text></g><g class="card" style="animation-delay:1.1s"><rect x="36" y="402" width="1060" height="30" fill="none" stroke="#2e5842" stroke-width="1.4" stroke-dasharray="4 3"/><text class="mono" x="50" y="422" font-size="11" style="fill:#2e5842">Independent of the ladder: C2PA Content Credentials on the source and the matched image. Valid ≠ trusted; absent ≠ evidence.</text></g>
</svg>
