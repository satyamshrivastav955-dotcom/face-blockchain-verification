<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="FaceProof: the receipts for where an image appeared">
<title>FaceProof: the receipts for where an image appeared</title>
<style>
text { font-family: Iowan Old Style, Palatino Linotype, Palatino, Book Antiqua, Georgia, serif; fill: #211c16; }
.mono { font-family: ui-monospace, Cascadia Mono, SF Mono, Menlo, Consolas, Courier New, monospace; }
.cap { font-family: ui-monospace, Cascadia Mono, SF Mono, Menlo, Consolas, Courier New, monospace; font-size: 11px; letter-spacing: 2.2px; text-transform: uppercase; fill: #7a6f5d; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes draw { from { stroke-dashoffset: 200; } to { stroke-dashoffset: 0; } }
    @keyframes thump { 0% { opacity: 0; transform: rotate(-20deg) scale(2); } 60% { opacity: .95; transform: rotate(-8deg) scale(.94); } 100% { opacity: .9; transform: rotate(-8deg) scale(1); } }
    @keyframes spin { from { opacity: 0; transform: rotate(-90deg) scale(1.3); } to { opacity: .85; transform: rotate(-10deg) scale(1); } }
    @keyframes pop { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: scale(1); } }
    .a { opacity: 0; animation: rise .8s ease forwards; }
    .under { stroke-dasharray: 200; stroke-dashoffset: 200; animation: draw 1.1s .9s ease forwards; }
    .stamp { transform-box: fill-box; transform-origin: center; opacity: 0; animation: thump .6s 1.5s cubic-bezier(.2,1.3,.4,1) forwards; }
    .seal { transform-box: fill-box; transform-origin: center; opacity: 0; animation: spin 1s 1.2s ease forwards; }
    .tag { transform-box: fill-box; transform-origin: center; opacity: 0; animation: pop .5s ease forwards; }
    </style>
<rect width="1200" height="470" fill="#f5efe0"/><g stroke="#d2c7ae" stroke-width="1" opacity="0.55"><line x1="0" y1="32" x2="1200" y2="32"/><line x1="0" y1="64" x2="1200" y2="64"/><line x1="0" y1="96" x2="1200" y2="96"/><line x1="0" y1="128" x2="1200" y2="128"/><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="192" x2="1200" y2="192"/><line x1="0" y1="224" x2="1200" y2="224"/><line x1="0" y1="256" x2="1200" y2="256"/><line x1="0" y1="288" x2="1200" y2="288"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="352" x2="1200" y2="352"/><line x1="0" y1="384" x2="1200" y2="384"/><line x1="0" y1="416" x2="1200" y2="416"/><line x1="0" y1="448" x2="1200" y2="448"/></g><rect x="1" y="1" width="1198" height="468" fill="none" stroke="#211c16" stroke-width="2"/><text class="cap a" x="56" y="62" style="animation-delay:.1s">File no. FP-001 · Image provenance, kept on file</text><text class="a" x="56" y="140" font-size="62" letter-spacing="-1.5" style="animation-delay:.25s">The receipts for</text><text class="a" x="56" y="214" font-size="62" letter-spacing="-1.5" style="animation-delay:.45s"><tspan font-style="italic" style="fill:#86281f">where</tspan> an image</text><text class="a" x="56" y="288" font-size="62" letter-spacing="-1.5" style="animation-delay:.65s">appeared.</text><path class="under" d="M58 226 C 90 232, 130 221, 196 228" fill="none" stroke="#86281f" stroke-width="3" opacity=".6"/><text class="a" x="58" y="330" font-size="16.5" style="fill:#483f33;animation-delay:1s">Re-examine every search lead locally. Say plainly whether the evidence is a face match</text><text class="a" x="58" y="354" font-size="16.5" style="fill:#483f33;animation-delay:1.1s">or only image similarity. Anchor a tamper-evident hash, never a face or a URL.</text><g transform="rotate(2.2 930 240)"><rect x="716" y="82" width="440" height="300" fill="#faf6ea" stroke="#b3a584"/></g><g transform="rotate(-1.6 930 240)"><rect x="716" y="82" width="440" height="300" fill="#efe7d3" stroke="#b3a584"/></g><g class="a" style="animation-delay:.5s"><rect x="728" y="92" width="416" height="296" fill="#faf6ea" stroke="#211c16" stroke-width="1.5"/><text class="mono" x="772" y="124" font-size="10.5" letter-spacing="2" style="fill:#7a6f5d">RECORD · FACEVERIFY/V2</text><line x1="772" y1="132" x2="1128" y2="132" stroke="#211c16" stroke-width="2"/><text class="mono" x="772" y="150" font-size="12.5" fill="#483f33" style="fill:#483f33">evidence_type</text><line x1="879" y1="146" x2="1070" y2="146" stroke="#b3a584" stroke-dasharray="1 4" stroke-width="1.6"/><text x="1128" y="150" text-anchor="end" font-size="13" font-style="italic" style="fill:#483f33">face_match | image_derivative</text><text class="mono" x="772" y="176" font-size="12.5" fill="#483f33" style="fill:#483f33">decision_rule</text><line x1="879" y1="172" x2="1070" y2="172" stroke="#b3a584" stroke-dasharray="1 4" stroke-width="1.6"/><text x="1128" y="176" text-anchor="end" font-size="13" font-style="italic" style="fill:#483f33">named, never implied</text><text class="mono" x="772" y="202" font-size="12.5" fill="#483f33" style="fill:#483f33">derivative_basis</text><line x1="902" y1="198" x2="1070" y2="198" stroke="#b3a584" stroke-dasharray="1 4" stroke-width="1.6"/><text x="1128" y="202" text-anchor="end" font-size="13" font-style="italic" style="fill:#483f33">geometric | phash</text><text class="mono" x="772" y="228" font-size="12.5" fill="#483f33" style="fill:#483f33">scores</text><line x1="826" y1="224" x2="1070" y2="224" stroke="#b3a584" stroke-dasharray="1 4" stroke-width="1.6"/><text x="1128" y="228" text-anchor="end" font-size="13" font-style="italic" style="fill:#483f33">cosine · inliers · pHash</text><text class="mono" x="772" y="254" font-size="12.5" fill="#483f33" style="fill:#483f33">content_credentials</text><line x1="924" y1="250" x2="1070" y2="250" stroke="#b3a584" stroke-dasharray="1 4" stroke-width="1.6"/><text x="1128" y="254" text-anchor="end" font-size="13" font-style="italic" style="fill:#483f33">C2PA state, signer</text><text class="mono" x="772" y="280" font-size="12.5" fill="#483f33" style="fill:#483f33">integrity</text><line x1="848" y1="276" x2="1070" y2="276" stroke="#b3a584" stroke-dasharray="1 4" stroke-width="1.6"/><text x="1128" y="280" text-anchor="end" font-size="13" font-style="italic" style="fill:#483f33">sha256 · restricted JCS</text><text class="mono" x="772" y="306" font-size="12.5" fill="#483f33" style="fill:#483f33">anchor</text><line x1="826" y1="302" x2="1070" y2="302" stroke="#b3a584" stroke-dasharray="1 4" stroke-width="1.6"/><text x="1128" y="306" text-anchor="end" font-size="13" font-style="italic" style="fill:#483f33">hash + keccak256(url)</text></g><g class="seal"><circle cx="790" cy="352" r="26" fill="none" stroke="#86281f" stroke-width="2.4"/><circle cx="790" cy="352" r="21" fill="none" stroke="#86281f" stroke-width="1" stroke-dasharray="2 3"/><path d="M779 353 l8 8 15 -18" fill="none" stroke="#86281f" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></g><g class="stamp"><rect x="1000" y="334" width="124" height="36" fill="none" stroke="#2e5842" stroke-width="2.6"/><rect x="1004" y="338" width="116" height="28" fill="none" stroke="#2e5842" stroke-width="1"/><text class="mono" x="1062" y="358" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="4" style="fill:#2e5842">SEALED</text></g><g class="tag" style="animation-delay:2.00s"><rect x="56" y="404" width="176" height="46" fill="#faf6ea" stroke="#211c16" stroke-width="1.5"/><text class="mono" x="68" y="424" font-size="12.5" font-weight="700" style="fill:#211c16">1 · DETECT</text><text class="mono" x="68" y="441" font-size="10" letter-spacing="1.6" style="fill:#2e5842">LOCAL</text></g><g class="tag" style="animation-delay:2.18s"><rect x="252" y="404" width="176" height="46" fill="#faf6ea" stroke="#211c16" stroke-width="1.5"/><text class="mono" x="264" y="424" font-size="12.5" font-weight="700" style="fill:#211c16">2 · SEARCH</text><text class="mono" x="264" y="441" font-size="10" letter-spacing="1.6" style="fill:#9e6b14">WITH CONSENT</text></g><g class="tag" style="animation-delay:2.36s"><rect x="448" y="404" width="176" height="46" fill="#faf6ea" stroke="#211c16" stroke-width="1.5"/><text class="mono" x="460" y="424" font-size="12.5" font-weight="700" style="fill:#211c16">3 · RE-EXAMINE</text><text class="mono" x="460" y="441" font-size="10" letter-spacing="1.6" style="fill:#2e5842">LOCAL</text></g><g class="tag" style="animation-delay:2.54s"><rect x="644" y="404" width="176" height="46" fill="#faf6ea" stroke="#211c16" stroke-width="1.5"/><text class="mono" x="656" y="424" font-size="12.5" font-weight="700" style="fill:#211c16">4 · SEAL</text><text class="mono" x="656" y="441" font-size="10" letter-spacing="1.6" style="fill:#2e5842">LOCAL</text></g><g class="tag" style="animation-delay:2.72s"><rect x="840" y="404" width="176" height="46" fill="#faf6ea" stroke="#211c16" stroke-width="1.5"/><text class="mono" x="852" y="424" font-size="12.5" font-weight="700" style="fill:#211c16">5 · ANCHOR</text><text class="mono" x="852" y="441" font-size="10" letter-spacing="1.6" style="fill:#24364f">ON-CHAIN</text></g>
</svg>
