<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e101f" />
      <stop offset="100%" stop-color="#080914" />
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#181a2e" />
      <stop offset="100%" stop-color="#141628" />
    </linearGradient>

    <style>
      .code-line { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, Courier, monospace; font-size: 12.5px; }
      .prompt-user { fill: #38bdf8; font-weight: 700; }
      .prompt-cmd { fill: #ffffff; font-weight: 600; }
      .log-dim { fill: #64748b; }
      .log-info { fill: #94a3b8; }
      .log-success { fill: #10b981; font-weight: 700; }
      .log-accent { fill: #a855f7; font-weight: 600; }
      .log-metric { fill: #00d4ff; font-weight: 600; }
      .log-gold { fill: #fbbf24; font-weight: 600; }

      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor {
        animation: blinkCursor 1s infinite;
        fill: #38bdf8;
      }

      @keyframes scanline {
        0% { transform: translateY(0); opacity: 0.15; }
        50% { opacity: 0.3; }
        100% { transform: translateY(320px); opacity: 0.15; }
      }
      .scan {
        animation: scanline 6s linear infinite;
      }
    </style>
  </defs>

  <!-- Terminal Window Body -->
  <rect width="880" height="320" rx="12" fill="url(#termBg)" stroke="#272b48" stroke-width="1.5" />

  <!-- Terminal Window Header -->
  <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 868 0 C 874.627 0 880 5.373 880 12 L 880 38 L 0 38 Z" fill="url(#headerGrad)" stroke="#272b48" stroke-width="1" />
  <line x1="0" y1="38" x2="880" y2="38" stroke="#272b48" stroke-width="1"/>

  <!-- Mac Window Dots -->
  <circle cx="22" cy="19" r="6" fill="#ef4444" opacity="0.85"/>
  <circle cx="42" cy="19" r="6" fill="#f59e0b" opacity="0.85"/>
  <circle cx="62" cy="19" r="6" fill="#10b981" opacity="0.85"/>

  <!-- Window Title -->
  <text x="440" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="500">
    bash: python -m src.main register — Live Dual-Verification &amp; Blockchain Anchor
  </text>

  <!-- Subtle Scanline Bar -->
  <rect x="0" y="38" width="880" height="2" fill="#38bdf8" opacity="0.2" class="scan"/>

  <!-- Terminal Code Content -->
  <!-- Line 1: Command -->
  <g transform="translate(26, 68)" class="code-line">
    <text x="0" y="0" class="prompt-user">satya@box</text>
    <text x="76" y="0" class="log-dim">:</text>
    <text x="86" y="0" class="log-accent">~/face-blockchain</text>
    <text x="218" y="0" class="log-dim">$</text>
    <text x="232" y="0" class="prompt-cmd">python -m src.main register --image input/my_photo3.jpeg</text>
  </g>

  <!-- Line 2: Step 1 Detection -->
  <g transform="translate(26, 96)" class="code-line">
    <text x="0" y="0" class="log-metric">→ [1/5] FACE ENGINE</text>
    <text x="160" y="0" class="log-info">YuNet detected 1 face (x=42, y=68, score=0.9984) · SFace 128-d extracted</text>
    <text x="730" y="0" class="log-success">✓ LOCAL ONLY</text>
  </g>

  <!-- Line 3: Step 2 Search Leads -->
  <g transform="translate(26, 124)" class="code-line">
    <text x="0" y="0" class="log-metric">→ [2/5] REVERSE LENS</text>
    <text x="160" y="0" class="log-info">25 web candidates retrieved · Prioritized social-first order (reddit, x.com)</text>
    <text x="730" y="0" class="log-success">✓ 25 LEADS</text>
  </g>

  <!-- Line 4: Step 3 Confirmation Header -->
  <g transform="translate(26, 152)" class="code-line">
    <text x="0" y="0" class="log-metric">→ [3/5] DUAL CONFIRM</text>
    <text x="160" y="0" class="log-info">Downloading bytes &amp; scoring candidate faces locally (Cosine ≥ 0.363, pHash ≤ 12)</text>
  </g>

  <!-- Table output -->
  <g transform="translate(46, 178)" class="code-line">
    <text x="0" y="0" class="log-dim">#</text>
    <text x="35" y="0" class="log-dim">DOMAIN</text>
    <text x="160" y="0" class="log-dim">COSINE</text>
    <text x="240" y="0" class="log-dim">pHash</text>
    <text x="320" y="0" class="log-dim">VERDICT</text>
    <text x="560" y="0" class="log-dim">INTEGRITY</text>
  </g>

  <!-- Row 1: Positive match -->
  <g transform="translate(46, 198)" class="code-line">
    <text x="0" y="0" class="log-info">1</text>
    <text x="35" y="0" class="prompt-cmd">reddit.com</text>
    <text x="160" y="0" class="log-success">0.9457</text>
    <text x="240" y="0" class="log-success">8 / 64</text>
    <text x="320" y="0" class="log-success">● CONFIRMED FACE MATCH</text>
    <text x="560" y="0" class="log-metric">Provenance Verified</text>
  </g>

  <!-- Row 2: Reject match -->
  <g transform="translate(46, 218)" class="code-line">
    <text x="0" y="0" class="log-info">2</text>
    <text x="35" y="0" class="log-info">kalloniscloset</text>
    <text x="160" y="0" class="log-gold">0.2684</text>
    <text x="240" y="0" class="log-dim">18 / 64</text>
    <text x="320" y="0" fill="#f43f5e">✗ REJECTED LOW SIMILARITY</text>
    <text x="560" y="0" class="log-dim">Blocked from Chain</text>
  </g>

  <!-- Line 6: Step 4 Canonical Record -->
  <g transform="translate(26, 248)" class="code-line">
    <text x="0" y="0" class="log-metric">→ [4/5] RFC 8785 CANON</text>
    <text x="160" y="0" class="log-info">Payload SHA-256: </text>
    <text x="290" y="0" class="log-accent">0xd54354584a4f3248d970270c1480b077...737d</text>
    <text x="730" y="0" class="log-success">✓ DETERMINISTIC</text>
  </g>

  <!-- Line 7: Step 5 On-chain anchor -->
  <g transform="translate(26, 276)" class="code-line">
    <text x="0" y="0" class="log-success">✔ [5/5] BASE SEPOLIA</text>
    <text x="160" y="0" class="log-info">Anchored in Block #1 · Tx: </text>
    <text x="345" y="0" class="log-gold">0x86ea82d8855f496f...132b</text>
    <text x="610" y="0" class="log-info">(First-Write-Wins)</text>
    <text x="730" y="0" class="log-success">✓ IMMUTABLE</text>
  </g>

  <!-- Cursor prompt -->
  <g transform="translate(26, 302)" class="code-line">
    <text x="0" y="0" class="prompt-user">satya@box</text>
    <text x="76" y="0" class="log-dim">:</text>
    <text x="86" y="0" class="log-accent">~/face-blockchain</text>
    <text x="218" y="0" class="log-dim">$</text>
    <rect x="232" y="-11" width="7" height="15" class="cursor" />
  </g>
</svg>
